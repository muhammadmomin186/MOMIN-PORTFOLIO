function esc(str) {

}
function uid() { return Math.random().toString(36).slice(2, 9); }

function getVideoEmbed(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')) {
      let id = u.searchParams.get('v');
      if (!id && u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
      if (!id && u.pathname.includes('/embed/')) id = u.pathname.split('/embed/')[1];
      if (!id) return null;
      return { type: 'iframe', src: `https://www.youtube.com/embed/${id}` };
    }
    if (u.hostname.includes('vimeo.com')) {
      const id = u.pathname.split('/').filter(Boolean).pop();
      if (!id) return null;
      return { type: 'iframe', src: `https://player.vimeo.com/video/${id}` };
    }
    return { type: 'video', src: url };
  } catch { return null; }
}

async function uploadImage(file, folder) {
  const path = `${folder}/${Date.now()}-${file.name}`;
  const ref = storageRef(storage, path);
  await uploadBytes(ref, file);
  return getDownloadURL(ref);
}

function renderProjectModal(i) {
  const p = pub.projects[i];
  const root = document.getElementById('projectModalRoot');
  if (!p) { root.innerHTML = ''; return; }
  const images = p.images?.length ? p.images : [];
  const embed = getVideoEmbed(p.videoUrl);
  const active = pub._modalActiveImg || 0;

  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 p-4 backdrop-blur-sm sm:items-center sm:p-6" id="modalBackdrop">
      <div class="card relative w-full max-w-3xl p-0" id="modalCard">
        <button id="modalClose" aria-label="Close" class="absolute right-4 top-4 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-surface2 text-ink hover:bg-surface3"><i class="fa-solid fa-xmark"></i></button>
        <div class="max-h-[80vh] overflow-y-auto p-6 sm:p-8">
          ${images.length ? `
            <div class="relative mb-6 aspect-video overflow-hidden rounded-xl border border-line bg-surface2">
              <img src="${esc(images[active])}" alt="" class="h-full w-full object-cover" />
              ${images.length > 1 ? `
                <button id="modalPrev" class="absolute left-2 top-1/2 -translate-y-1/2 flex h-8 w-8 items-center justify-center rounded-full bg-black/50 text-white"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                <button id="modalNext" class="absolute right-2 top-1/2 -translate-y-1/2 flex h-8 w-8 items-center justify-center rounded-full bg-black/50 text-white"><i class="fa-solid fa-chevron-right text-xs"></i></button>
              ` : ''}
            </div>
            ${images.length > 1 ? `<div class="mb-6 flex gap-2 overflow-x-auto">${images.map((img, idx) => `<button data-thumb="${idx}" class="h-14 w-20 flex-shrink-0 overflow-hidden rounded-lg border ${idx === active ? 'border-dev' : 'border-line opacity-60'}"><img src="${esc(img)}" class="h-full w-full object-cover" /></button>`).join('')}</div>` : ''}
          ` : ''}
          ${embed ? `
            <div class="mb-6 aspect-video overflow-hidden rounded-xl border border-line bg-black">
              ${embed.type === 'iframe' ? `<iframe src="${esc(embed.src)}" title="Project video" class="h-full w-full" allowfullscreen></iframe>` : `<video src="${esc(embed.src)}" controls class="h-full w-full"></video>`}
            </div>` : ''}
          <h3 class="font-display text-2xl font-bold">${esc(p.title)}</h3>
          <p class="mt-2 text-sm leading-relaxed text-muted sm:text-base">${esc(p.description)}</p>
          ${p.features?.length ? `<ul class="mt-4 space-y-2">${p.features.map((f) => `<li class="flex items-start gap-2 text-sm text-muted"><span class="mt-1.5 h-1.5 w-1.5 flex-shrink-0 rounded-full bg-grad-brand"></span>${esc(f)}</li>`).join('')}</ul>` : ''}
          ${p.tags?.length ? `<div class="mt-5 flex flex-wrap gap-2">${p.tags.map((t) => `<span class="rounded-full border border-line px-3 py-1 text-xs text-muted">${esc(t)}</span>`).join('')}</div>` : ''}
          <div class="mt-6 flex flex-wrap gap-3">
            ${p.liveUrl ? `<a href="${esc(p.liveUrl)}" target="_blank" rel="noreferrer" class="btn-primary btn-sm">Live Site <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i></a>` : ''}
            ${p.repoUrl ? `<a href="${esc(p.repoUrl)}" target="_blank" rel="noreferrer" class="btn-outline btn-sm"><i class="fa-brands fa-github"></i> Code</a>` : ''}
          </div>
        </div>
      </div>
    </div>`;

  $('#modalClose').onclick = () => { pub.openProjectIdx = null; pub._modalActiveImg = 0; root.innerHTML = ''; };
  $('#modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') $('#modalClose').onclick(); };
  const prev = $('#modalPrev'), next = $('#modalNext');
  if (prev) prev.onclick = () => { pub._modalActiveImg = (active - 1 + images.length) % images.length; renderProjectModal(i); };
  if (next) next.onclick = () => { pub._modalActiveImg = (active + 1) % images.length; renderProjectModal(i); };
  $$('[data-thumb]', root).forEach((b) => b.onclick = () => { pub._modalActiveImg = Number(b.dataset.thumb); renderProjectModal(i); });
}

function wirePublicEvents() {
  const navbar = $('#navbar');
  function onScroll() {
    if (window.scrollY > 12) navbar.classList.add('bg-base/85', 'backdrop-blur-md', 'border-b', 'border-line');
    else navbar.classList.remove('bg-base/85', 'backdrop-blur-md', 'border-b', 'border-line');
  }
  window.addEventListener('scroll', onScroll);
  onScroll();

  $('#menuBtn').onclick = () => $('#mobileMenu').classList.toggle('hidden');
  $$('#mobileMenu a').forEach((a) => a.onclick = () => $('#mobileMenu').classList.add('hidden'));

  $$('[data-open-project]').forEach((btn) => {
    btn.onclick = () => { pub.openProjectIdx = Number(btn.dataset.openProject); pub._modalActiveImg = 0; renderProjectModal(pub.openProjectIdx); };
  });
}

onAuthStateChanged(auth, (u) => {
  adminState.user = u;
  if (location.hash === ADMIN_HASH) renderAdminGate();
});

function renderAdminGate() {
  if (adminState.user === undefined) {
    document.getElementById('app').innerHTML = `<div class="flex min-h-screen items-center justify-center bg-base text-sm text-muted">Checking session…</div>`;
    return;
  }
  if (!adminState.user) { renderAdminLogin(); return; }
  loadAdminData().then(renderAdminDashboard);
}

async function loadAdminData() {
  const snap = await getDoc(CONTENT_DOC);
  adminState.content = snap.exists() ? {
    hero: { ...DEFAULT_CONTENT.hero, ...snap.data().hero },
    about: { ...DEFAULT_CONTENT.about, ...snap.data().about },
    stats: snap.data().stats?.length ? snap.data().stats : DEFAULT_CONTENT.stats,
    contact: { ...DEFAULT_CONTENT.contact, ...snap.data().contact },
    social: { ...DEFAULT_CONTENT.social, ...snap.data().social },
  } : null;
  adminState.contentExists = snap.exists();

  const [skillsSnap, servicesSnap, projectsSnap] = await Promise.all([
    getDocs(query(collection(db, 'skills'), orderBy('order', 'asc'))),
    getDocs(query(collection(db, 'services'), orderBy('order', 'asc'))),
    getDocs(query(collection(db, 'projects'), orderBy('order', 'asc'))),
  ]);
  adminState.skills = skillsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  adminState.services = servicesSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  adminState.projects = projectsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

function renderAdminLogin() {
  document.getElementById('app').innerHTML = `
    <div class="flex min-h-screen items-center justify-center bg-base px-6 font-body text-ink">
      <form id="loginForm" class="card w-full max-w-sm p-8">
        <h1 class="font-display text-xl font-bold">Admin Sign In</h1>
        <p class="mt-1 text-sm text-muted">Only you should have this link.</p>
        <div class="mt-6"><label class="label">Email</label><input id="loginEmail" class="input" type="email" required /></div>
        <div class="mt-4"><label class="label">Password</label><input id="loginPassword" class="input" type="password" required /></div>
        <p id="loginError" class="mt-3 hidden text-xs text-rose-400">Wrong email or password.</p>
        <button type="submit" id="loginSubmit" class="btn-primary mt-6 w-full justify-center">Sign In</button>
        <p class="mt-5 text-xs text-muted">No account yet? Create one in Firebase Console → Authentication → Users, using email/password sign-in.</p>
      </form>
    </div>`;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#loginSubmit'); btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, $('#loginEmail').value, $('#loginPassword').value);
    } catch {
      $('#loginError').classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  };
}

];

function renderAdminDashboard() {

    <div class="min-h-screen bg-base font-body text-ink">
      <div class="flex flex-col md:flex-row">

function renderAdminTabContent() {

function savedFlag(container) {
  const span = document.createElement('span');
  span.className = 'text-xs text-emerald-400';

  container.appendChild(span);

/* ---- Hero editor ---- */
function renderHeroEditor(main) {
  const h = adminState.content?.hero || DEFAULT_CONTENT.hero;
  main.innerHTML = `
    <form id="heroForm" class="max-w-xl space-y-5">
      <div><h2 class="font-display text-xl font-bold">Hero Section</h2><p class="text-sm text-muted">The first thing visitors see.</p></div>
      <div><label class="label">Greeting</label><input class="input" name="greeting" value="${esc(h.greeting)}" /></div>
      <div><label class="label">Full Name</label><input class="input" name="name" value="${esc(h.name)}" /><p class="mt-1 text-xs text-muted">The last word is shown in gradient color automatically.</p></div>
      <div><label class="label">Role</label><input class="input" name="role" value="${esc(h.role)}" /></div>
      <div><label class="label">Role Highlight</label><input class="input" name="roleHighlight" value="${esc(h.roleHighlight)}" /></div>
      <div><label class="label">Short Description</label><textarea class="input" rows="4" name="description">${esc(h.description)}</textarea></div>
      <div>
        <label class="label">Photo</label>
        <div class="flex gap-2">
          <input class="input flex-1" name="photoUrl" id="photoUrlInput" value="${esc(h.photoUrl)}" placeholder="Paste an image URL…" />
          <label class="btn-outline btn-sm cursor-pointer">Upload<input type="file" id="photoUpload" accept="image/*" class="hidden" /></label>
        </div>
        <p id="photoUploadStatus" class="mt-1 text-xs text-muted"></p>
        ${h.photoUrl ? `<img src="${esc(h.photoUrl)}" class="mt-2 h-20 w-20 rounded-lg border border-line object-cover" id="photoPreview" />` : `<img class="mt-2 hidden h-20 w-20 rounded-lg border border-line object-cover" id="photoPreview" />`}
      </div>
      <div><label class="label">Resume / CV URL</label><input class="input" name="resumeUrl" value="${esc(h.resumeUrl)}" /></div>
      <div class="flex items-center gap-3 pt-2" id="heroSaveRow"><button type="submit" class="btn-primary">Save Changes</button></div>
    </form>`;

  $('#photoUpload').onchange = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    $('#photoUploadStatus').textContent = 'Uploading…';
    try {
      const url = await uploadImage(file, 'hero');
      $('#photoUrlInput').value = url;
      const preview = $('#photoPreview'); preview.src = url; preview.classList.remove('hidden');
      $('#photoUploadStatus').textContent = '';
    } catch { $('#photoUploadStatus').textContent = 'Upload failed — check Storage is enabled.'; }
  };

  $('#heroForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const hero = Object.fromEntries(fd.entries());
    await setDoc(CONTENT_DOC, { hero }, { merge: true });
    adminState.content = { ...adminState.content, hero };
    adminState.contentExists = true;
    savedFlag($('#heroSaveRow'));
  };
}

/* ---- About & stats editor ---- */
function renderAboutEditor(main) {
  const a = adminState.content?.about || DEFAULT_CONTENT.about;
  let stats = JSON.parse(JSON.stringify(adminState.content?.stats || DEFAULT_CONTENT.stats));

  function paintStats() {
    $('#statsList').innerHTML = stats.map((s, i) => `
      <div class="flex items-center gap-2" data-stat-row="${i}">
        <input class="input w-24 stat-value" value="${esc(s.value)}" placeholder="15+" />
        <input class="input flex-1 stat-label" value="${esc(s.label)}" placeholder="Projects Completed" />
        <button type="button" data-remove-stat="${i}" class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-lg text-muted hover:bg-surface2 hover:text-rose-400"><i class="fa-solid fa-trash text-xs"></i></button>
      </div>`).join('');
    $$('[data-remove-stat]').forEach((b) => b.onclick = () => { stats.splice(Number(b.dataset.removeStat), 1); paintStats(); });
    $('#statsCount').textContent = `(${stats.length}/6)`;
  }

  main.innerHTML = `
    <form id="aboutForm" class="max-w-xl space-y-5">
      <div><h2 class="font-display text-xl font-bold">About & Stats</h2><p class="text-sm text-muted">Tell visitors what you're about, with a few numbers.</p></div>
      <div><label class="label">Eyebrow Label</label><input class="input" name="eyebrow" value="${esc(a.eyebrow)}" /></div>
      <div><label class="label">Heading</label><input class="input" name="heading" value="${esc(a.heading)}" /></div>
      <div><label class="label">Heading Highlight</label><input class="input" name="headingHighlight" value="${esc(a.headingHighlight)}" /><p class="mt-1 text-xs text-muted">Must be an exact phrase inside the heading — shown in gradient color.</p></div>
      <div><label class="label">Paragraph</label><textarea class="input" rows="5" name="paragraph">${esc(a.paragraph)}</textarea></div>
      <div class="pt-4">
        <div class="flex items-center justify-between"><label class="label !mb-0">Stats <span id="statsCount"></span></label><button type="button" id="addStatBtn" class="btn-outline !px-3 !py-1.5 text-xs"><i class="fa-solid fa-plus text-[10px]"></i> Add Stat</button></div>
        <div id="statsList" class="mt-3 space-y-3"></div>
      </div>
      <div class="flex items-center gap-3 pt-2" id="aboutSaveRow"><button type="submit" class="btn-primary">Save Changes</button></div>
    </form>`;

  paintStats();
  $('#addStatBtn').onclick = () => { if (stats.length < 6) { stats.push({ id: uid(), value: '0', label: 'New Stat' }); paintStats(); } };

  $('#aboutForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const about = Object.fromEntries(fd.entries());
    const rows = $$('[data-stat-row]');
    const newStats = rows.map((row, i) => ({ id: stats[i].id || uid(), value: row.querySelector('.stat-value').value, label: row.querySelector('.stat-label').value }));
    await setDoc(CONTENT_DOC, { about, stats: newStats }, { merge: true });
    adminState.content = { ...adminState.content, about, stats: newStats };
    adminState.contentExists = true;
    savedFlag($('#aboutSaveRow'));
  };
}

            <select id="newSkillSelect" class="input">${ICON_KEYS.map((k) => `<option value="${k}">${ICONS[k].label}</option>`).join('')}</select>
          </div>
          <button type="button" id="addSkillBtn" class="btn-primary !px-4 !py-2 text-sm"><i class="fa-solid fa-plus text-[10px]"></i> Add</button>
        </div>
        <div id="skillsList" class="space-y-2">
          ${adminState.skills.map((s, i) => `
            <div class="card flex items-center gap-3 px-4 py-3">
              ${iconHtml(s.iconKey, 20)}
              <span class="flex-1 text-sm">${esc((ICONS[s.iconKey] || ICONS.javascript).label)}</span>
              <button data-skill-up="${i}" ${i === 0 ? 'disabled' : ''} class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink disabled:opacity-30"><i class="fa-solid fa-arrow-up text-xs"></i></button>
              <button data-skill-down="${i}" ${i === adminState.skills.length - 1 ? 'disabled' : ''} class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink disabled:opacity-30"><i class="fa-solid fa-arrow-down text-xs"></i></button>
              <button data-skill-del="${s.id}" class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-rose-400"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>`).join('') || `<p class="text-sm text-muted">No skills yet.</p>`}
        </div>
      </div>`;

    $('#addSkillBtn').onclick = async () => {
      const maxOrder = adminState.skills.reduce((m, s) => Math.max(m, s.order ?? 0), -1);
      const ref = await addDoc(collection(db, 'skills'), { iconKey: $('#newSkillSelect').value, order: maxOrder + 1 });
      adminState.skills.push({ id: ref.id, iconKey: $('#newSkillSelect').value, order: maxOrder + 1 });
      paint();
    };
    $$('[data-skill-del]').forEach((b) => b.onclick = async () => {
      await deleteDoc(doc(db, 'skills', b.dataset.skillDel));
      adminState.skills = adminState.skills.filter((s) => s.id !== b.dataset.skillDel);
      paint();
    });
    $$('[data-skill-up]').forEach((b) => b.onclick = () => moveSkill(Number(b.dataset.skillUp), -1));
    $$('[data-skill-down]').forEach((b) => b.onclick = () => moveSkill(Number(b.dataset.skillDown), 1));

    async function moveSkill(idx, dir) {
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= adminState.skills.length) return;
      const a = adminState.skills[idx], b = adminState.skills[swapIdx];
      await updateDoc(doc(db, 'skills', a.id), { order: b.order });
      await updateDoc(doc(db, 'skills', b.id), { order: a.order });
      [a.order, b.order] = [b.order, a.order];
      adminState.skills.sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
      paint();
    }
  }
  paint();
}

    $$('[data-sv-del]').forEach((b) => b.onclick = async () => {

async function updateItem(col, id, data) { await updateDoc(doc(db, col, id), data); }

/* ---- Projects editor ---- */
function renderProjectsEditor(main) {
  function paint() {
    main.innerHTML = `
      <div class="max-w-xl space-y-6">
        <div class="flex items-center justify-between">
          <div><h2 class="font-display text-xl font-bold">Projects</h2><p class="text-sm text-muted">Each project shows its name, what it does, then images and video.</p></div>
          <button id="addProjectBtn" class="btn-outline !px-4 !py-2 text-xs"><i class="fa-solid fa-plus text-[10px]"></i> Add Project</button>
        </div>
        <div id="projectsList" class="space-y-3">
          ${adminState.projects.map((p, i) => projectEditorRow(p, i)).join('') || `<p class="text-sm text-muted">No projects yet.</p>`}
        </div>
      </div>`;

    $('#addProjectBtn').onclick = async () => {
      const maxOrder = adminState.projects.reduce((m, p) => Math.max(m, p.order ?? 0), -1);
      const data = { title: 'New Project', description: '', features: [], tags: [], images: [], videoUrl: '', liveUrl: '', repoUrl: '', order: maxOrder + 1 };
      const ref = await addDoc(collection(db, 'projects'), data);
      adminState.projects.push({ id: ref.id, ...data });
      paint();
    };
    wireProjectRows();
  }

  function projectEditorRow(p, i) {
    return `
      <div class="card overflow-hidden" data-project-id="${p.id}">
        <button type="button" data-toggle-project="${i}" class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left">
          <span class="font-medium">${esc(p.title) || 'Untitled project'}</span>
          <i class="fa-solid fa-chevron-down text-xs text-muted proj-chevron"></i>
        </button>
        <div class="proj-body hidden space-y-4 border-t border-line p-4">
          <div><label class="label">Project Name</label><input class="input pj-title" value="${esc(p.title)}" /></div>
          <div><label class="label">Short Description</label><textarea class="input pj-desc" rows="2">${esc(p.description)}</textarea></div>
          <div><label class="label">What it has / what it can do</label><textarea class="input pj-features" rows="4" placeholder="One per line">${esc((p.features || []).join('\n'))}</textarea></div>
          <div><label class="label">Tags / Tech used (comma separated)</label><input class="input pj-tags" value="${esc((p.tags || []).join(', '))}" placeholder="React, Firebase, Tailwind" /></div>
          <div>
            <label class="label">Images</label>
            <div class="flex gap-2">
              <textarea class="input pj-images flex-1" rows="3" placeholder="One image URL per line">${esc((p.images || []).join('\n'))}</textarea>
              <label class="btn-outline btn-sm cursor-pointer self-start">Upload<input type="file" accept="image/*" class="hidden pj-upload" /></label>
            </div>
            <p class="mt-1 text-xs text-muted pj-upload-status"></p>
            <p class="mt-1 text-xs text-muted">First image is used as the card thumbnail.</p>
          </div>
          <div><label class="label">Video URL</label><input class="input pj-video" value="${esc(p.videoUrl)}" placeholder="YouTube, Vimeo, or a direct .mp4 link" /></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="label">Live Site URL</label><input class="input pj-live" value="${esc(p.liveUrl)}" /></div>
            <div><label class="label">Code / Repo URL</label><input class="input pj-repo" value="${esc(p.repoUrl)}" /></div>
          </div>
          <div class="flex items-center gap-3 pt-2">
            <button type="button" data-save-project="${i}" class="btn-primary !px-4 !py-2 text-sm">Save Project</button>
            <span class="pj-saved-${i}"></span>
            <div class="ml-auto flex gap-1">
              <button data-pj-up="${i}" ${i === 0 ? 'disabled' : ''} class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink disabled:opacity-30"><i class="fa-solid fa-arrow-up text-xs"></i></button>
              <button data-pj-down="${i}" ${i === adminState.projects.length - 1 ? 'disabled' : ''} class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-ink disabled:opacity-30"><i class="fa-solid fa-arrow-down text-xs"></i></button>
              <button data-pj-del="${p.id}" class="rounded-lg p-2 text-muted hover:bg-surface2 hover:text-rose-400"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function wireProjectRows() {
    $$('[data-toggle-project]').forEach((b) => b.onclick = () => {
      const card = b.closest('[data-project-id]');
      card.querySelector('.proj-body').classList.toggle('hidden');
      card.querySelector('.proj-chevron').classList.toggle('fa-chevron-down');
      card.querySelector('.proj-chevron').classList.toggle('fa-chevron-up');
    });

    $$('.pj-upload').forEach((input, i) => {
      input.onchange = async (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        const card = input.closest('[data-project-id]');
        const status = card.querySelector('.pj-upload-status');
        status.textContent = 'Uploading…';
        try {
          const url = await uploadImage(file, `projects/${card.dataset.projectId}`);
          const textarea = card.querySelector('.pj-images');
          textarea.value = textarea.value ? `${textarea.value}\n${url}` : url;
          status.textContent = 'Added ✓';
          setTimeout(() => status.textContent = '', 1500);
        } catch { status.textContent = 'Upload failed — check Storage is enabled.'; }
      };
    });

    $$('[data-save-project]').forEach((b) => b.onclick = async () => {
      const i = Number(b.dataset.saveProject);
      const card = $$('[data-project-id]')[i];
      const data = {
        title: card.querySelector('.pj-title').value,
        description: card.querySelector('.pj-desc').value,
        features: card.querySelector('.pj-features').value.split('\n').map((s) => s.trim()).filter(Boolean),
        tags: card.querySelector('.pj-tags').value.split(',').map((s) => s.trim()).filter(Boolean),
        images: card.querySelector('.pj-images').value.split('\n').map((s) => s.trim()).filter(Boolean),
        videoUrl: card.querySelector('.pj-video').value,
        liveUrl: card.querySelector('.pj-live').value,
        repoUrl: card.querySelector('.pj-repo').value,
      };
      await updateItem('projects', adminState.projects[i].id, data);
      adminState.projects[i] = { ...adminState.projects[i], ...data };
      const flag = document.createElement('span'); flag.className = 'text-xs text-emerald-400'; flag.textContent = 'Saved ✓';
      card.querySelector(`.pj-saved-${i}`).appendChild(flag);
      setTimeout(() => flag.remove(), 1500);
      card.querySelector('button[data-toggle-project] span').textContent = data.title || 'Untitled project';
    });

    $$('[data-pj-del]').forEach((b) => b.onclick = async () => {
      await deleteDoc(doc(db, 'projects', b.dataset.pjDel));
      adminState.projects = adminState.projects.filter((p) => p.id !== b.dataset.pjDel);
      paint();
    });
    $$('[data-pj-up]').forEach((b) => b.onclick = () => moveProject(Number(b.dataset.pjUp), -1));
    $$('[data-pj-down]').forEach((b) => b.onclick = () => moveProject(Number(b.dataset.pjDown), 1));

    async function moveProject(idx, dir) {
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= adminState.projects.length) return;
      const a = adminState.projects[idx], b = adminState.projects[swapIdx];
      await updateDoc(doc(db, 'projects', a.id), { order: b.order });
      await updateDoc(doc(db, 'projects', b.id), { order: a.order });
      [a.order, b.order] = [b.order, a.order];
      adminState.projects.sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
      paint();
    }
  }

  paint();
}

/* ---- Contact & social editor ---- */
function renderContactEditor(main) {
  const c = adminState.content?.contact || DEFAULT_CONTENT.contact;
  const soc = adminState.content?.social || DEFAULT_CONTENT.social;
  main.innerHTML = `
    <form id="contactForm" class="max-w-xl space-y-8">
      <div><h2 class="font-display text-xl font-bold">Contact & Social</h2><p class="text-sm text-muted">How people reach you, and your social links.</p></div>
      <div class="space-y-4">
        <p class="text-xs font-medium uppercase tracking-wide text-muted">Contact section</p>
        <div><label class="label">Heading</label><input class="input" name="heading" value="${esc(c.heading)}" /></div>
        <div><label class="label">Paragraph</label><textarea class="input" rows="3" name="paragraph">${esc(c.paragraph)}</textarea></div>
        <div><label class="label">Email</label><input class="input" type="email" name="email" value="${esc(c.email)}" /></div>
        <div><label class="label">Phone</label><input class="input" name="phone" value="${esc(c.phone)}" /></div>
        <div><label class="label">Location</label><input class="input" name="location" value="${esc(c.location)}" placeholder="Lahore, Pakistan" /></div>
      </div>
      <div class="space-y-4">
        <p class="text-xs font-medium uppercase tracking-wide text-muted">Social links</p>
        ${['github','linkedin','twitter','instagram','whatsapp'].map((k) => `<div><label class="label capitalize">${k}</label><input class="input" name="social_${k}" value="${esc(soc[k] || '')}" placeholder="${k === 'whatsapp' ? 'https://wa.me/92xxxxxxxxxx' : 'https://…'}" /></div>`).join('')}
      </div>
      <div class="flex items-center gap-3 pt-2" id="contactSaveRow"><button type="submit" class="btn-primary">Save Changes</button></div>
    </form>`;

  $('#contactForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const contact = { eyebrow: c.eyebrow, heading: fd.get('heading'), paragraph: fd.get('paragraph'), email: fd.get('email'), phone: fd.get('phone'), location: fd.get('location') };
    const social = { github: fd.get('social_github'), linkedin: fd.get('social_linkedin'), twitter: fd.get('social_twitter'), instagram: fd.get('social_instagram'), whatsapp: fd.get('social_whatsapp') };
    await setDoc(CONTENT_DOC, { contact, social }, { merge: true });
    adminState.content = { ...adminState.content, contact, social };
    adminState.contentExists = true;
    savedFlag($('#contactSaveRow'));
  };
}

/* ---- Settings ---- */
function renderSettingsEditor(main) {
  main.innerHTML = `
    <div class="max-w-xl space-y-8">
      <div><h2 class="font-display text-xl font-bold">Settings</h2><p class="text-sm text-muted">Setup and account info.</p></div>
      ${!adminState.contentExists ? `
        <div class="card space-y-3 p-5">
          <p class="text-sm font-medium">First time here?</p>
          <p class="text-sm text-muted">Your site is currently showing placeholder content. Click below once to load starter content into your database — then edit everything from the tabs on the left.</p>
          <button id="seedBtn" class="btn-primary !px-4 !py-2 text-sm">Load Starter Content</button>
          <p id="seedStatus" class="text-sm text-emerald-400"></p>
        </div>` : ''}
      <div class="card space-y-2 p-5">
        <p class="text-sm font-medium">Account</p>
        <p class="text-sm text-muted">Signed in as ${esc(adminState.user?.email || '')}</p>
        <p class="text-sm text-muted">To change your password, go to Firebase Console → Authentication → Users.</p>
      </div>
      <div class="card space-y-2 p-5">
        <p class="text-sm font-medium">Admin link</p>
        <p class="text-sm text-muted">This panel lives at <code class="font-mono text-dev">${esc(ADMIN_HASH)}</code>. Keep that link private — anyone who knows it will still need your email and password to sign in.</p>
      </div>
    </div>`;

  const seedBtn = $('#seedBtn');
  if (seedBtn) seedBtn.onclick = async () => {
    seedBtn.disabled = true; seedBtn.textContent = 'Setting up…';
    const snap = await getDoc(CONTENT_DOC);
    if (!snap.exists()) await setDoc(CONTENT_DOC, DEFAULT_CONTENT);
    for (const s of DEFAULT_SKILLS) await addDoc(collection(db, 'skills'), s);
    for (const s of DEFAULT_SERVICES) await addDoc(collection(db, 'services'), s);
    for (const p of DEFAULT_PROJECTS) await addDoc(collection(db, 'projects'), p);
    await loadAdminData();
    $('#seedStatus').textContent = 'Starter content loaded — go edit it from the tabs on the left.';
    seedBtn.remove();
  };
}
